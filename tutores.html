<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro de Tutor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(to right top, #00c6ff, #0072ff);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .form-container {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(12px);
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #fff;
        }

        h2 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 28px;
            color: #ffffff;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
            font-size: 14px;
            color: #e0f7fa;
        }

        input[type="text"],
        input[type="email"] {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: none;
            border-radius: 8px;
            background-color: rgba(255, 255, 255, 0.3);
            color: #fff;
            font-size: 16px;
        }

        input::placeholder {
            color: #d0ecff;
        }

        input[type="submit"] {
            width: 100%;
            padding: 12px;
            background-color: #0288d1;
            color: white;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        input[type="submit"]:hover {
            background-color: #0277bd;
        }

        .footer {
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
            color: #e3f2fd;
        }
    </style>
</head>
<body>
    <div class="form-container">
        <h2>Registro de Tutor</h2>
      <form action="tutores.php" method="POST" onsubmit="return validarFormulario()">
    <label for="nombre">Nombre:</label>
    <input type="text" id="nombre" name="nombre" placeholder="Ej. Juan Pérez"
           required pattern="[A-Za-zÁÉÍÓÚáéíóúÑñ\s]+" title="Solo letras y espacios.">

    <label for="telefono">Teléfono:</label>
    <input type="text" id="telefono" name="telefono" placeholder="Ej. 5551234567"
           required pattern="\d{10}" title="Debe contener exactamente 10 dígitos numéricos.">

    <label for="correo">Correo:</label>
    <input type="email" id="correo" name="correo" placeholder="Ej. correo@ejemplo.com" required>

    <input type="submit" value="Registrar">
</form>

<script>
function validarFormulario() {
    const nombre = document.getElementById("nombre").value.trim();
    const telefono = document.getElementById("telefono").value.trim();

    const regexNombre = /^[A-Za-zÁÉÍÓÚáéíóúÑñ\s]+$/;
    const regexTelefono = /^\d{10}$/;

    if (!regexNombre.test(nombre)) {
        alert("El nombre solo puede contener letras y espacios.");
        return false;
    }

    if (!regexTelefono.test(telefono)) {
        alert("El teléfono debe contener exactamente 10 dígitos numéricos.");
        return false;
    }

    return true;
}
</script>

        <div class="footer">
            &copy; 2025 Sistema de Tutores
        </div>
    </div>
</body>
</html>
