<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro de Maestro</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(to right top, #00c6ff, #0072ff);
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .form-container {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px);
            padding: 40px;
            border-radius: 16px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            color: #fff;
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
            color: #e0f7fa;
        }

        input[type="text"],
        input[type="email"] {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: none;
            border-radius: 8px;
            background-color: rgba(255, 255, 255, 0.3);
            color: #fff;
            font-size: 16px;
        }

        input::placeholder {
            color: #d0ecff;
        }

        input[type="submit"] {
            background-color: #0288d1;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.3s ease;
        }

        input[type="submit"]:hover {
            background-color: #0277bd;
        }

        .footer {
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
            color: #e3f2fd;
        }
    </style>
</head>
<body>
    <div class="form-container">
        <h2>Registro de Maestro</h2>
      <form action="maestro.php" method="POST" onsubmit="return validarFormulario()">
    <label for="nombre">Nombre:</label>
    <input type="text" id="nombre" name="nombre" placeholder="Ej. María López"
           required pattern="[A-Za-zÁÉÍÓÚáéíóúÑñ\s]+" title="Solo letras y espacios.">

    <label for="correo">Correo:</label>
    <input type="email" id="correo" name="correo" placeholder="correo@ejemplo.com" required>

    <label for="numero">Número:</label>
    <input type="text" id="numero" name="numero" placeholder="Ej. 5551234567"
           required pattern="\d{10}" title="Debe tener exactamente 10 dígitos numéricos.">

    <label for="grado">Grado:</label>
    <input type="text" id="grado" name="grado" placeholder="Ej. 3"
           required pattern="[1-9]" title="Debe ser un número entre 1 y 9.">

    <input type="submit" value="Registrar Maestro">
</form>

<script>
function validarFormulario() {
    const nombre = document.getElementById("nombre").value.trim();
    const numero = document.getElementById("numero").value.trim();
    const grado = document.getElementById("grado").value.trim();

    const regexNombre = /^[A-Za-zÁÉÍÓÚáéíóúÑñ\s]+$/;
    const regexNumero = /^\d{10}$/;
    const regexGrado = /^[1-9]$/;

    if (!regexNombre.test(nombre)) {
        alert("❌ El nombre solo puede contener letras y espacios.");
        return false;
    }

    if (!regexNumero.test(numero)) {
        alert("❌ El número debe contener exactamente 10 dígitos.");
        return false;
    }

    if (!regexGrado.test(grado)) {
        alert("❌ El grado debe ser un solo número entre 1 y 9.");
        return false;
    }

    return true;
}
</script>

        <div class="footer">
            &copy; 2025 Sistema de Registro de Maestros
        </div>
    </div>
</body>
</html>
