<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>¡Las Vocales Mágicas!</title>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.4.0/dist/confetti.browser.min.js"></script>

    <style>
        /* 1. Importación de Fuente (Nunito) */
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&display=swap');

        /* 2. Estilos Base y Fondo ANIMADO */
        body {
            font-family: 'Nunito', sans-serif;
            background: linear-gradient(135deg, #e0f7fa, #b2ebf2, #e0f7fa, #ffffff);
            background-size: 400% 400%;
            animation: gentleGradient 25s ease infinite;
            text-align: center;
            margin: 0;
            padding: 1.5rem;
            overflow-x: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        @keyframes gentleGradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* 3. Contenedor Principal */
        .main-container {
            max-width: 950px;
            width: 100%;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 24px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.12);
            padding: 2rem 2.5rem;
            box-sizing: border-box;
        }

        /* 4. Títulos */
        h1 {
            font-weight: 900;
            font-size: clamp(2.2em, 5vw, 2.8em);
            color: #0288d1;
            margin-top: 0;
            margin-bottom: 1.5rem;
            border-bottom: 4px solid #fff59d;
            padding-bottom: 0.5rem;
        }
        h2 {
            font-weight: 700;
            color: #0277bd;
            margin-bottom: 0.5rem;
        }
        p {
            color: #555;
            font-size: 1.1em;
        }

        /* 5. Grid de Letras (Aplicado a las vocales) */
        .letter-selector-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(80px, 1fr));
            gap: 1rem;
            margin-top: 1.5rem;
            margin-bottom: 2rem;
            
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }

        /* 6. Botones 3D */
        .btn-3d {
            font-family: 'Nunito', sans-serif;
            font-weight: 900;
            border: 3px solid transparent;
            border-radius: 12px;
            padding: 0.8rem;
            transition: all 0.15s ease;
            cursor: pointer;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            box-shadow: 0 5px 0 0 var(--shadow-color, #00000030);
            animation: shine 2.5s infinite ease-in-out;
        }
        .btn-3d:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 0 var(--shadow-color, #00000030);
            animation: none;
        }
        .btn-3d:not(:active):hover {
            animation: jiggle 0.3s;
        }

        @keyframes shine {
            0% { box-shadow: 0 5px 0 0 var(--shadow-color), 0 0 4px transparent; }
            50% { box-shadow: 0 5px 0 0 var(--shadow-color), 0 0 15px var(--shadow-color); }
            100% { box-shadow: 0 5px 0 0 var(--shadow-color), 0 0 4px transparent; }
        }
        @keyframes jiggle {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(-3deg); }
            75% { transform: rotate(3deg); }
        }

        .letra-btn {
            font-size: clamp(2em, 6vw, 2.8em);
        }

        /* Colores temáticos */
        .letra-btn:nth-child(5n+1) { background: #ffcdd2; color: #d32f2f; --shadow-color: #d32f2f; }
        .letra-btn:nth-child(5n+2) { background: #c8e6c9; color: #388e3c; --shadow-color: #388e3c; }
        .letra-btn:nth-child(5n+3) { background: #bbdefb; color: #1976d2; --shadow-color: #1976d2; }
        .letra-btn:nth-child(5n+4) { background: #fff9c4; color: #b5830e; --shadow-color: #b5830e; }
        .letra-btn:nth-child(5n+5) { background: #e1bee7; color: #7b1fa2; --shadow-color: #7b1fa2; }
        
        /* 6.1: Botones de Navegación */
        .navigation-buttons {
            margin-top: 2.5rem; 
            display: flex;
            justify-content: center;
            gap: 1rem;
        }

        .btn-menu {
            font-size: clamp(1.2em, 4vw, 1.5em); 
            padding: 1rem 2rem;
            text-decoration: none;
            display: inline-flex; 
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: #bbdefb; 
            color: #1976d2; 
            --shadow-color: #1976d2;
            animation: none; 
        }
        
        .btn-menu img {
            height: 1.5em; 
            width: auto;
            display: block;
            border-radius: 8px; 
        }
        
        .btn-menu span {
            display: block;
        }

         .btn-menu:not(:active):hover {
            animation: jiggle 0.3s;
         }

        /* 7. Área de Visualización */
        .sound-display-area {
            margin-top: 1rem;
            background: #f9f9f9;
            border: 3px dashed #ccc;
            border-radius: 20px;
            min-height: 300px;
            padding: 1rem;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background-color 0.4s, border-color 0.4s;
            overflow: hidden;
        }
        #animatedLetterDisplay {
            font-weight: 900;
            font-size: clamp(8em, 30vw, 15em);
            color: #ccc;
            transition: color 0.4s;
            user-select: none;
        }
        #animatedLetterDisplay.initial {
            font-size: clamp(1.5em, 5vw, 2.2em);
            font-weight: 700;
            color: #777;
            padding: 0 1rem;
        }
        .animated-letter {
            animation: boing 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes boing {
            0% { transform: scale(0.1) rotate(-30deg); opacity: 0; }
            50% { transform: scale(1.2) rotate(10deg); opacity: 1; }
            70% { transform: scale(0.9) rotate(-5deg); }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }

        /* 8. Brillantina */
        .estrellita {
            position: absolute;
            font-size: 40px;
            animation: subir 1.5s ease-out forwards;
            z-index: 100;
            pointer-events: none;
        }

        @keyframes subir {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-100px) scale(1.5); }
        }

        /* 9. Media Queries */
        @media (max-width: 900px) {
             .letter-selector-grid {
                grid-template-columns: repeat(auto-fit, minmax(70px, 1fr));
            }
        }
        @media (max-width: 600px) {
            body { padding: 0.5rem; }
            .main-container { padding: 1.5rem 1rem; }
            .letter-selector-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 0.5rem;
            }
             .btn-3d { padding: 0.6rem; }
             .letra-btn { font-size: clamp(1.8em, 5vw, 2.2em); }
            .sound-display-area { min-height: 200px; }
            #animatedLetterDisplay { font-size: clamp(6em, 25vw, 12em); }
             #animatedLetterDisplay.initial { font-size: clamp(1.2em, 4vw, 1.8em); }
        
            .navigation-buttons {
                flex-direction: column;
                margin-top: 2rem;
            }
            .btn-menu {
                width: 100%;
                box-sizing: border-box; 
                padding: 1rem 1.5rem; 
            }
        }
        
        @media (min-width: 601px) and (max-width: 800px) {
             .letter-selector-grid {
                grid-template-columns: repeat(5, 1fr);
            }
        }
    </style>
</head>

<body>

    <div class="main-container">

        <h1>¡Las Vocales Mágicas!</h1>
        <h2>¡Escucha y Aprende!</h2>
        <p>Toca una vocal para oír su sonido y ver la animación.</p>

        <section class="letter-selector">
            <div class="letter-selector-grid">
                <button class="letra-btn btn-3d" data-letra="a">A</button>
                <button class="letra-btn btn-3d" data-letra="e">E</button>
                <button class="letra-btn btn-3d" data-letra="i">I</button>
                <button class="letra-btn btn-3d" data-letra="o">O</button>
                <button class="letra-btn btn-3d" data-letra="u">U</button>
            </div>
        </section>

        <section class="sound-display-area" id="soundDisplay">
            <span id="animatedLetterDisplay" class="initial">¡Bienvenido a las Vocales!</span>
        </section>

        <div class="navigation-buttons">
            <a href="inicio.html" class="btn-3d btn-menu">
                <img src="https://static.vecteezy.com/system/resources/previews/011/795/207/non_2x/cartoon-house-and-the-sun-in-the-grass-field-vector.jpg" alt="Inicio">
                <span>Ir al Inicio</span>
            </a>
        </div>
    </div>

    <audio id="aplausos" src="https://cdn.pixabay.com/audio/2022/03/15/audio_b8c58a0b30.mp3" preload="auto"></audio>

<script>
    // --- VARIABLES GLOBALES ---
    const displayColoresVocales = ['#e57373', '#81c784', '#64b5f6', '#ffb74d', '#ba68c8'];
    const vocales = ['a', 'e', 'i', 'o', 'u'];

    // --- ELEMENTOS ---
    const aplausos = document.getElementById('aplausos');
    const letterButtons = document.querySelectorAll('.letra-btn');
    const soundDisplay = document.getElementById('soundDisplay');
    const animatedLetterDisplay = document.getElementById('animatedLetterDisplay');

    // --- FUNCIONES DE AUDIO Y EFECTOS ---
    
    // --- FUNCIÓN 'hablar' CORREGIDA ---
    function hablar(texto) {
        if ('speechSynthesis' in window) {
            speechSynthesis.cancel();
            const voz = new SpeechSynthesisUtterance();
            voz.lang = 'es-ES';
            voz.rate = 0.9;
            voz.pitch = 1.2;

            const letraMinuscula = texto.toLowerCase();
            
            // Asignamos el texto a pronunciar
            voz.text = texto; 

            // --- INICIO DE LA CORRECCIÓN ---
            // Si la letra es 'u', le agregamos un punto.
            // Esto es un truco común para forzar al motor de voz (speechSynthesis)
            // a pronunciar la vocal 'U' correctamente en lugar de que suene como 'O'.
            if (letraMinuscula === 'u') {
                voz.text = 'U.';
            }
            // --- FIN DE LA CORRECCIÓN ---

            speechSynthesis.speak(voz);
        }
    }
    // --- FIN DE LA FUNCIÓN CORREGIDA ---

    function playAplausos() {
        aplausos.currentTime = 0;
        aplausos.volume = 0.4;
        aplausos.play().catch(e => console.log("Error al reproducir audio:", e));
    }

    function lanzarEstrellita(elemento) {
        const estrella = document.createElement('div');
        estrella.textContent = '✨';
        estrella.className = 'estrellita';
        const rect = elemento.getBoundingClientRect();
        estrella.style.left = (rect.left + rect.width / 2 - 20) + 'px';
        estrella.style.top = (rect.top + window.scrollY + rect.height / 2 - 50) + 'px';
        document.body.appendChild(estrella);
        setTimeout(() => estrella.remove(), 1500);
    }

    function triggerConfetti(element) {
        const rect = element.getBoundingClientRect();
        const originX = (rect.left + rect.width / 2) / window.innerWidth;
        const originY = (rect.top + rect.height / 2) / window.innerHeight;
        confetti({
            particleCount: 50,
            spread: 70,
            origin: { x: originX, y: originY },
            colors: displayColoresVocales
        });
    }

    // --- LÓGICA PRINCIPAL ---
     document.addEventListener('DOMContentLoaded', () => {
        setTimeout(() => {
             hablar('Toca una vocal para escucharla.');
        }, 500);
        
        if(animatedLetterDisplay.classList.contains('initial')) {
             animatedLetterDisplay.textContent = '¡Bienvenido a las Vocales!';
        }
     });

    letterButtons.forEach(v => {
        v.addEventListener('click', () => {
            const letra = v.dataset.letra; 
            const style = window.getComputedStyle(v);
            const bgColor = style.backgroundColor;
            const defaultTextColor = style.color;

            let displayColor;

            if (vocales.includes(letra.toLowerCase())) {
                displayColor = displayColoresVocales[Math.floor(Math.random() * displayColoresVocales.length)];
            } else {
                displayColor = defaultTextColor;
            }

            hablar(letra);
            playAplausos();
            triggerConfetti(v);
            animatedLetterDisplay.classList.remove('initial');

            animatedLetterDisplay.textContent = letra.toUpperCase();
            animatedLetterDisplay.style.color = displayColor;
            
            soundDisplay.style.borderColor = displayColor;
            soundDisplay.style.backgroundColor = bgColor;

            animatedLetterDisplay.classList.remove('animated-letter');
            setTimeout(() => {
                animatedLetterDisplay.classList.add('animated-letter');
                lanzarEstrellita(animatedLetterDisplay);
            }, 10);
        });
    });

</script>

</body>
</html>
