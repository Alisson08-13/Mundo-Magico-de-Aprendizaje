<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Registro de Niño | Silabario Mágico</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap');
    
    *, *::before, *::after {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'Fredoka One', cursive;
      background: radial-gradient(circle, #fff0f8, #f8f0ff);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      position: relative;
    }

    /* Botón para volver al inicio */
    .btn-volver {
      position: absolute;
      top: 20px;
      left: 20px;
      background-color: #ff85d4;
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 30px;
      font-size: 1rem;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(255, 133, 212, 0.4);
      transition: all 0.3s ease;
      text-decoration: none;
    }

    .btn-volver:hover {
      background-color: #ff9de2;
      transform: translateY(-2px);
      box-shadow: 0 6px 15px rgba(255, 133, 212, 0.5);
    }

    .form-container {
      background: #ffffff;
      border-radius: 25px;
      padding: 30px 40px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
      text-align: center;
      width: 90%;
      max-width: 400px;
    }

    h2 {
      background-color: #ff85d4;
      color: white;
      padding: 15px 25px;
      border-radius: 50px;
      display: inline-block;
      margin-top: 0;
      margin-bottom: 30px;
      font-size: 1.6rem;
      box-shadow: 0 4px 12px rgba(255, 133, 212, 0.4);
    }

    label { 
      display: block; 
      text-align: left; 
      margin-top: 10px; 
      color: #555;
      margin-bottom: 5px;
      font-size: 0.9rem;
    }

    input[type="text"], input[type="number"] {
      width: 100%;
      padding: 12px 15px;
      border: 2px solid #e0e0e0;
      border-radius: 15px;
      margin-bottom: 15px;
      background: #fdfdfd;
      font-family: 'Fredoka One', cursive;
      font-size: 1rem;
      color: #555;
      transition: border-color 0.3s ease;
    }

    input[type="text"]:focus, input[type="number"]:focus {
      border-color: #b280d4;
      outline: none;
      box-shadow: 0 0 8px rgba(178, 128, 212, 0.3);
    }

    input[type="submit"] {
      background-color: #b280d4;
      border: none;
      color: white;
      font-size: 1.2rem;
      font-family: 'Fredoka One', cursive;
      padding: 15px 25px;
      border-radius: 15px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 5px 15px rgba(178, 128, 212, 0.4);
      width: 100%;
      margin-top: 10px;
    }

    input[type="submit"]:hover {
      transform: translateY(-3px);
      background-color: #c190e4;
      box-shadow: 0 8px 20px rgba(178, 128, 212, 0.6);
    }
  </style>
</head>
<body>

  <!-- Botón volver -->
  <a href="index.html" class="btn-volver">⬅ Inicio</a>

  <div class="form-container">
    <h2>Registro de Niño 👦</h2>
    <form action="niños.php" method="POST">
      <label>Nombre:</label>
      <input type="text" name="nombre" required>

      <label>Edad:</label>
      <input type="number" name="edad" required min="1" max="18">

      <label>Tema de dificultad:</label>
      <input type="text" name="tema" required>

      <input type="submit" value="Registrar">
    </form>
  </div>

</body>
</html>
